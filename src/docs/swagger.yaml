openapi: 3.0.3
info:
  title: UnaHur Anti-Social Net API
  version: 1.0.0
  description: |
    API REST de la red social **UnaHur Anti-Social Net**.

    - Todas las peticiones y respuestas usan JSON, salvo la subida de imagenes (`multipart/form-data`).
    - Los datos de entrada se validan con Joi antes de llegar al controlador.
    - Un post puede tener muchas imagenes y cada imagen pertenece a un solo post.
      Si se borra un post, se borran tambien sus imagenes y comentarios.
    - Las imagenes se guardan en la carpeta `media/` y se sirven desde `/media/{archivo}`;
      al borrar una imagen (directamente o en cascada) tambien se borra su archivo.
    - Si se borra un usuario, se borran en cascada sus posts y comentarios.

servers:
  - url: http://localhost:{port}
    description: Servidor local
    variables:
      port:
        default: "3000"
        description: Valor de la variable de entorno PORT

tags:
  - name: Posts
    description: Publicaciones de los usuarios
  - name: PostImages
    description: Imagenes asociadas a un post

paths:
  /post:
    get:
      tags: [Posts]
      summary: Listar todos los posts
      operationId: obtenerPosts
      responses:
        "200":
          description: Lista de posts, del mas reciente al mas antiguo, con el nickName del usuario, sus imagenes y sus tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostResumen"
        "500":
          description: Error al obtener los posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeConError"
              example:
                message: Error al obtener los post
                error: Detalle del error

    post:
      tags: [Posts]
      summary: Crear un post
      operationId: crearPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Post creado con éxito
                  post:
                    $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/PostInvalido"
        "404":
          description: No existe un usuario con el userId enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Usuario no encontrado
        "500":
          description: Error al crear el post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeConError"
              example:
                message: Error al crear el post
                error: Detalle del error

  /post/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      tags: [Posts]
      summary: Obtener un post por id
      operationId: obtenerPost
      responses:
        "200":
          description: Post encontrado con sus imagenes, tags y comentarios visibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetalle"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/PostNoEncontrado"
        "500":
          description: Error al obtener el post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Error al obtener el post

    put:
      tags: [Posts]
      summary: Modificar la descripcion de un post
      description: Solo se actualiza la `descripcion`. `userId` se acepta pero no es obligatorio y no se modifica.
      operationId: modificarPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateInput"
      responses:
        "200":
          description: Post modificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Post modificado con éxito
        "400":
          description: Id invalido o datos del body invalidos
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Mensaje"
                  - $ref: "#/components/schemas/ErrorValidacionPost"
              examples:
                idInvalido:
                  summary: Id invalido
                  value:
                    message: El id debe ser entero y positivo.
                bodyInvalido:
                  summary: Body invalido
                  value:
                    message: datos invalidos para modificar el post
                    error: '"descripcion" length must be at least 3 characters long'
        "404":
          $ref: "#/components/responses/PostNoEncontrado"
        "500":
          description: Error al modificar el post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeConError"
              example:
                message: Error al modificar el post
                error: Detalle del error

    delete:
      tags: [Posts]
      summary: Borrar un post
      description: Borra el post y, en cascada, sus imagenes, sus comentarios y sus asignaciones de tags.
      operationId: borrarPost
      responses:
        "200":
          description: Post eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Post eliminado con éxito
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/PostNoEncontrado"
        "500":
          description: Error al eliminar el post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Error al eliminar el post

  /postImages:
    get:
      tags: [PostImages]
      summary: Listar todas las imagenes
      operationId: obtenerPostImages
      responses:
        "200":
          description: Lista de imagenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostImage"
        "500":
          description: Error al obtener las imagenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Error al obtener las imagenes

    post:
      tags: [PostImages]
      summary: Subir una imagen a un post
      description: |
        Recibe el archivo en el campo `imagen` (jpg, png o webp, maximo 5 MB) y el id del post en `postId`.
        El archivo se guarda en `media/` y en la base queda su url (`/media/{archivo}`), desde donde se puede ver.
      operationId: crearPostImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PostImageInput"
      responses:
        "201":
          description: Imagen creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostImageCreada"
        "400":
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidacionImagen"
              examples:
                sinImagen:
                  summary: Falta el archivo
                  value:
                    message: Datos invalidos
                    errores: La imagen es obligatoria
                formatoInvalido:
                  summary: El archivo no es jpg, png o webp
                  value:
                    message: Datos invalidos
                    errores: La imagen debe ser jpg, png o webp
                muyGrande:
                  summary: El archivo supera los 5 MB
                  value:
                    message: Datos invalidos
                    errores: La imagen no puede superar los 5 MB
                campoIncorrecto:
                  summary: El archivo vino en otro campo
                  value:
                    message: Datos invalidos
                    errores: La imagen debe enviarse en el campo 'imagen'
                sinPostId:
                  summary: Falta postId
                  value:
                    message: Datos invalidos
                    errores: El postId es obligatorio
                postIdInvalido:
                  summary: postId no es un numero
                  value:
                    message: Datos invalidos
                    errores: El postId debe ser un numero
        "404":
          $ref: "#/components/responses/PostNoEncontrado"
        "500":
          description: Error al crear la imagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Error al crear la imagen

  /postImages/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      tags: [PostImages]
      summary: Obtener una imagen por id
      operationId: obtenerPostImgPorId
      responses:
        "200":
          description: Imagen encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostImage"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/ImagenNoEncontrada"
        "500":
          $ref: "#/components/responses/ErrorObtenerImagen"

    delete:
      tags: [PostImages]
      summary: Borrar una imagen
      operationId: borrarImagen
      responses:
        "200":
          description: Imagen eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Imagen eliminada con exito
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          $ref: "#/components/responses/ImagenNoEncontrada"
        "500":
          description: Error al buscar o borrar la imagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              examples:
                errorAlBuscar:
                  summary: Fallo la busqueda de la imagen
                  value:
                    message: Error al obtener la imagen
                errorAlBorrar:
                  summary: Fallo el borrado
                  value:
                    message: Error al borrar la imagen

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Id del recurso. Debe ser un entero positivo.
      schema:
        type: integer
        minimum: 1
        example: 1

  schemas:
    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        descripcion:
          type: string
          example: Mi primer post
        userId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostResumen:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        descripcion:
          type: string
          example: Mi primer post
        createdAt:
          type: string
          format: date-time
        usuario:
          type: object
          properties:
            nickName:
              type: string
              example: tomas
        imagenes:
          type: array
          items:
            $ref: "#/components/schemas/ImagenDePost"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagDePost"

    PostDetalle:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          properties:
            imagenes:
              type: array
              items:
                $ref: "#/components/schemas/ImagenDePost"
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagDePost"
            comentarios:
              type: array
              items:
                $ref: "#/components/schemas/Comment"

    ImagenDePost:
      type: object
      properties:
        id:
          type: integer
          example: 1
        urlImage:
          type: string
          example: /media/1793130669927-foto.jpeg

    TagDePost:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: viajes

    PostInput:
      type: object
      required: [userId, descripcion]
      additionalProperties: false
      properties:
        userId:
          type: integer
          minimum: 1
          example: 1
        descripcion:
          type: string
          minLength: 3
          maxLength: 500
          example: Mi primer post

    PostUpdateInput:
      type: object
      required: [descripcion]
      additionalProperties: false
      properties:
        userId:
          type: integer
          minimum: 1
          description: Opcional, no se modifica
          example: 1
        descripcion:
          type: string
          minLength: 3
          maxLength: 500
          example: Descripcion editada

    PostImage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        urlImage:
          type: string
          description: Ruta desde la que el servidor sirve el archivo
          example: /media/1793130669927-foto.jpeg
        postId:
          type: integer
          example: 1

    PostImageCreada:
      type: object
      properties:
        message:
          type: string
          example: Imagen creada con exito
        imagen:
          $ref: "#/components/schemas/PostImage"

    PostImageInput:
      type: object
      required: [imagen, postId]
      properties:
        imagen:
          type: string
          format: binary
          description: Archivo jpg, png o webp de hasta 5 MB
        postId:
          type: integer
          minimum: 1
          description: Id de un post existente
          example: 1

    Mensaje:
      type: object
      properties:
        message:
          type: string

    MensajeConError:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
          description: Mensaje tecnico del error

    ErrorValidacionImagen:
      type: object
      properties:
        message:
          type: string
          example: Datos invalidos
        errores:
          type: string
          description: Primer error de validacion encontrado
          example: La imagen es obligatoria

    ErrorValidacionPost:
      type: object
      properties:
        message:
          type: string
          example: datos invalidos para crear el post
        error:
          type: string
          description: Primer error de validacion de Joi
          example: '"userId" is required'

  responses:
    IdInvalido:
      description: El id no es un entero positivo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Mensaje"
          example:
            message: El id debe ser entero y positivo.

    PostNoEncontrado:
      description: No existe un post con ese id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Mensaje"
          example:
            message: Post no encontrado

    ImagenNoEncontrada:
      description: No existe una imagen con ese id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Mensaje"
          example:
            message: Imagen no encontrada

    ErrorObtenerImagen:
      description: Error al obtener la imagen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Mensaje"
          example:
            message: Error al obtener la imagen

    PostInvalido:
      description: Datos del body invalidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorValidacionPost"
          example:
            message: datos invalidos para crear el post
            error: '"userId" is required'
