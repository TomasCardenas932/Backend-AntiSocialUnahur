tags:
  - name: Follows
    description: Seguimientos entre usuarios registrados.

paths:
  /users/{nickName}/follow/{seguido}:
    parameters:
      - name: nickName
        in: path
        required: true
        description: NickName del usuario que realiza el seguimiento.
        schema:
          type: string
        example: marce28
      - name: seguido
        in: path
        required: true
        description: NickName del usuario al que se quiere seguir o dejar de seguir.
        schema:
          type: string
        example: juan23
    post:
      tags: [Follows]
      summary: Seguir a otro usuario
      operationId: seguirUsuario
      description: No requiere body. La API no implementa autenticacion; ambos usuarios se identifican por la URL.
      responses:
        "201":
          description: Seguimiento creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowCreado"
        "400":
          description: Un usuario no puede seguirse a si mismo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Un usuario no puede seguirse a sí mismo
        "404":
          description: El usuario seguidor o el usuario seguido no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "409":
          description: La relacion de seguimiento ya existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
              example:
                message: Ya seguís a este usuario
        "500":
          description: Error interno al crear el seguimiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
    delete:
      tags: [Follows]
      summary: Dejar de seguir a otro usuario
      operationId: dejarDeSeguir
      responses:
        "204":
          description: Seguimiento eliminado. No devuelve contenido.
        "400":
          description: Un usuario no puede dejar de seguirse a si mismo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "404":
          description: Alguno de los usuarios no existe o la relacion de seguimiento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "500":
          description: Error interno al eliminar el seguimiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"

  /users/{nickName}/followers:
    parameters:
      - $ref: "#/components/parameters/FollowNickName"
    get:
      tags: [Follows]
      summary: Consultar los seguidores de un usuario
      operationId: obtenerSeguidores
      responses:
        "200":
          description: Lista de usuarios que siguen al usuario indicado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowUser"
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "500":
          description: Error al obtener los seguidores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"

  /users/{nickName}/following:
    parameters:
      - $ref: "#/components/parameters/FollowNickName"
    get:
      tags: [Follows]
      summary: Consultar los usuarios seguidos
      operationId: obtenerSeguidos
      responses:
        "200":
          description: Lista de usuarios a quienes sigue el usuario indicado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowUser"
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"
        "500":
          description: Error al obtener los usuarios seguidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"

components:
  parameters:
    FollowNickName:
      name: nickName
      in: path
      required: true
      description: NickName del usuario que se consulta.
      schema:
        type: string
      example: marce28
  schemas:
    FollowUser:
      type: object
      properties:
        id:
          type: integer
          example: 2
        nickName:
          type: string
          example: juan23
        email:
          type: string
          format: email
          example: juan@example.com
    Follow:
      type: object
      properties:
        id:
          type: integer
          example: 1
        followerId:
          type: integer
          example: 1
        followingId:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FollowCreado:
      type: object
      properties:
        message:
          type: string
          example: Usuario seguido correctamente
        seguimiento:
          $ref: "#/components/schemas/Follow"